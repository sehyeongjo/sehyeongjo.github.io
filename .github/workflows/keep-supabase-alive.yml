name: Keep Supabase Alive

# Free-plan projects pause after 7 days without activity; one daily read keeps it awake.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
    - name: Query Supabase
      # Same public URL/key as config.js (read-only via RLS); update both if the key is rotated.
      run: |
        curl -fsS -H "apikey: sb_publishable_ATEA_6WQIXN3ihZyfuTzfQ_DblGCsBU" \
          "https://htmlmkjugyijvynbdnpx.supabase.co/rest/v1/contents?select=id&limit=1"
